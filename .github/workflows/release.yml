name: Release userscript
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # GitHub's Ubuntu runner ships Google Chrome, so Playwright needs no browser download.
      - run: npm test
        env:
          BROWSER_CHANNEL: chrome
      - name: Verify tag and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const version = fs.readFileSync("dubtv-plus.meta.js", "utf8").match(/@version\s+(\S+)/)[1]; assert.equal(process.env.RELEASE_TAG, `v${version}`);'
          gh release upload "$RELEASE_TAG" dubtv-plus.user.js dubtv-plus.meta.js assets/icon.svg
