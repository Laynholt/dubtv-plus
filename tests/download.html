 requests.push(String(url));
 if(String(url).startsWith('https://cdn.example/'))cacheModes.push(options.cache);
 if(String(url).startsWith('/release/'))return new Response(`<script>self.__next_f.push(${payload})<\/script>`);

 if(String(url).endsWith('index.m3u8'))return new Response(playlist);
 if(slowSegment || (pauseSecond && String(url).endsWith('b.ts')))return new Promise((resolve,reject)=>options.signal.addEventListener('abort',()=>reject(new DOMException('Aborted','AbortError')),{once:true}));
 return failSegment?new Response('error',{status:503}):originalFetch('/tests/fixtures/sample-'+(String(url).endsWith('a.ts')?'00':'01')+'.ts');
};
function writable(){return {write:async value=>writes.push(value),close:async()=>closed++,abort:async()=>aborted++};}
window.showSaveFilePicker=async()=>({createWritable:async()=>writable()});
window.showDirectoryPicker=async()=>({removeEntry:async name=>{files.delete(name);removed++;},getFileHandle:async(name,options)=>{if(!options?.create&&!files.has(name))throw new DOMException('missing','NotFoundError');if(options?.create)files.add(name);return {getFile:async()=>({size:0}),createWritable:async()=>writable()};}});
</script><script src="/src/library.js"></script><script src="/vendor/mux-mp4.min.js"></script><script>const muxmp4=muxjs;</script><script>window.downloadReady=new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='/src/download.js?test='+Date.now();script.onload=resolve;script.onerror=reject;document.head.append(script);});</script>
<script type="module">

const refresh=createDownloadTools(document.querySelector('#panel'));refresh();
document.querySelector('#dubtv-plus-download-open').click();await tick();

Object.defineProperty(document,'fullscreenElement',{value:fullscreenHost,configurable:true});document.dispatchEvent(new Event('fullscreenchange'));
check('Progress and cancel are visible inside fullscreen',fullscreenHost.contains(document.querySelector('#dubtv-plus-download-progress')));
Object.defineProperty(document,'fullscreenElement',{value:null,configurable:true});document.dispatchEvent(new Event('fullscreenchange'));
check('Progress returns to the page after fullscreen',document.querySelector('#dubtv-plus-download-progress').parentElement===document.body);
document.querySelector('#dubtv-plus-download-progress button').click();
files.clear();
document.querySelector('#dubtv-plus-download-open').click();await tick();
writes=[];closed=0;requests=[];dialog.querySelector('[name=episode]').value='all';dialog.querySelector('form').requestSubmit();await settled();
check('Whole title saves sequential episodes',closed===2&&writes.length===6&&requests.filter(u=>u.endsWith('master.m3u8')).length===2);
dialog.querySelector('form').requestSubmit();await settled();
check('Existing files are neither overwritten nor removed',writes.length===6&&files.size===2&&removed===0&&dialog.querySelector('[role=status]').textContent.includes('уже существует'));
files.clear();failSegment=true;dialog.querySelector('form').requestSubmit();await settled();
check('Failed title download removes only its incomplete file',removed===1&&files.size===0);
failSegment=true;aborted=0;dialog.querySelector('[name=episode]').value='1';dialog.querySelector('form').requestSubmit();await settled();
check('HTTP failure aborts incomplete file',aborted===1&&dialog.querySelector('[role=status]').textContent.includes('503'));
check('Retry clears the previous completed progress',dialog.querySelector('progress').value===0);
failSegment=false;pauseSecond=true;aborted=0;dialog.querySelector('form').requestSubmit();
for(let i=0;i<150&&dialog.querySelector('progress').value!==50;i++)await new Promise(r=>setTimeout(r,20));
check('One of two fragments updates both bar and percentage to 50',dialog.querySelector('progress').value===50&&dialog.querySelector('[data-percent]').textContent==='50%'&&dialog.querySelector('[data-size]').textContent.endsWith(' МБ'));
dialog.querySelector('[data-cancel]').click();await tick();pauseSecond=false;slowSegment=true;
check('Cancellation aborts pending request and file',aborted===1&&!dialog.open);
check('Single episode cancellation deletes its empty file',files.size===0&&removed===3);
document.querySelector('#dubtv-plus-download-open').click();await tick();dialog.querySelector('[name=episode]').value='all';dialog.querySelector('form').requestSubmit();await tick();dialog.querySelector('[data-cancel]').click();await tick();
check('Title cancellation cleans up its new empty file',files.size===0&&removed===4);
document.querySelector('#dubtv-plus-download-current').click();await tick();window.dispatchEvent(new Event('pagehide'));await tick();
check('Page reload cancels the request and removes the empty file',files.size===0&&removed===5);
slowSegment=false;
delete window.showSaveFilePicker;delete window.showDirectoryPicker;
requests=[];
document.querySelector('#dubtv-plus-download-open').click();await tick();dialog.querySelector('[name=episode]').value='all';dialog.querySelector('form').requestSubmit();await settled();
const save=dialog.querySelector('[data-save]');
check('Safari fallback exposes one completed episode',!save.hidden&&save.download.endsWith('.mp4')&&save.href.startsWith('blob:'));
check('Fallback does not buffer whole title at once',!requests.some(u=>u.includes('/2/'))&&dialog.querySelector('[data-queue]').textContent==='1 из 2');
save.addEventListener('click',event=>event.preventDefault(),{once:true});save.click();await tick();
check('Next episode waits until the previous file is saved',!dialog.querySelector('[data-next]').hidden&&save.download.includes('01'));
dialog.querySelector('[data-next]').click();await settled();
check('Next episode waits for an explicit save action',!save.hidden&&save.download.includes('02'));
check('Next episode updates the series and queue in the progress card',dialog.querySelector('[data-episode]').textContent==='Серия 2'&&dialog.querySelector('[data-queue]').textContent==='2 из 2');
dialog.querySelector('[data-cancel]').click();await tick();
check('Fallback cancellation releases download link',save.hidden&&!save.hasAttribute('href'));
const fileAPI=navigator.storage.getDirectory;
navigator.storage.getDirectory=undefined;
document.querySelector('#dubtv-plus-download-open').click();await tick();dialog.querySelector('[name=episode]').value='1';dialog.querySelector('form').requestSubmit();await settled();
check('Download still offers a saved MP4 when the file API is unavailable',!save.hidden&&save.href.startsWith('blob:')&&save.download.includes('01'));
const databaseOutput=new Uint8Array(await(await originalFetch(save.href)).arrayBuffer());
check('Database download link contains the assembled MP4',databaseOutput.length>1000&&String.fromCharCode(...databaseOutput.slice(4,8))==='ftyp');
document.querySelector('[data-cancel]').click();await tick();navigator.storage.getDirectory=fileAPI;
const databaseRequest=indexedDB.open('dubtv-plus-downloads',1);
const remainingParts=await new Promise((resolve,reject)=>{databaseRequest.onerror=()=>reject(databaseRequest.error);databaseRequest.onsuccess=()=>{const db=databaseRequest.result,tx=db.transaction('parts'),request=tx.objectStore('parts').getAllKeys();tx.oncomplete=()=>{db.close();resolve(request.result);};tx.onabort=()=>{db.close();reject(tx.error);};};});
check('Closing a database download removes its temporary parts and link',remainingParts.length===0&&save.hidden&&!save.hasAttribute('href'));
const storageDirectory=await navigator.storage.getDirectory(),cacheDirectory=await storageDirectory.getDirectoryHandle('dubtv-plus-downloads',{create:true});
const cacheNames=async()=>{const result=[];for await(const name of cacheDirectory.keys())result.push(name);return result.sort();};
const cacheBefore=await cacheNames(),nativeDirectory=navigator.storage.getDirectory;let releaseCacheCreation;
let delayCreation=true;navigator.storage.getDirectory=()=>delayCreation?(delayCreation=false,new Promise(resolve=>{releaseCacheCreation=()=>resolve(storageDirectory);})):Promise.resolve(storageDirectory);
document.querySelector('#dubtv-plus-download-current').click();
for(let i=0;i<150&&!releaseCacheCreation;i++)await new Promise(r=>setTimeout(r,20));
check('Temporary file creation can be pending during navigation',typeof releaseCacheCreation==='function');

window.fetch=async()=>new Promise(resolve=>{resolveRelease=()=>resolve(new Response(`<script>self.__next_f.push(${slowPayload})<\/script>`));});

resolveRelease();await tick();
