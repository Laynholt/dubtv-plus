};
window.showDirectoryPicker=undefined;let shareCalls=[],downloadFiles=[],copyStreams=0;const nativeObjectURL=URL.createObjectURL,nativeBlobStream=Blob.prototype.stream;URL.createObjectURL=function(blob){if(blob instanceof File&&blob.name.endsWith('.mp4'))downloadFiles.push(blob);return nativeObjectURL.call(this,blob);};Blob.prototype.stream=function(){copyStreams++;return nativeBlobStream.call(this);};
